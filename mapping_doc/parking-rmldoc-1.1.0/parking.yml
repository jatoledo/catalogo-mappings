prefixes:
  schema: https://schema.org/
  geosparql: http://www.opengis.net/ont/geosparql#
  dct: http://purl.org/dc/terms/
  edintapar: https://edint.es/def/aparcamiento#
  geo: http://www.opengis.net/ont/geosparql#
  sosa: http://www.w3.org/ns/sosa/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  xsd: http://www.w3.org/2001/XMLSchema#

sources:
  parkingspot-source: ['1_parkingspot__data_normalizado.csv~csv']
  parkinggroup-source: ['2_parkinggroup_data_normalizado.csv~csv']
  offstreetparking-source: ['3_offstreetparking_data_normalizado.csv~csv']

mappings:
  # PLAZA DE APARCAMIENTO
  parking-spot:
    sources:
      - parkingspot-source
    s: https://example.org/recurso/plaza-aparcamiento/$(entityid)
    po:
      - [a, edintapar:ParkingSpot]
      - [dct:identifier, $(entityid)]
      - p: rdfs:label
        o:
          value:  "$(description)"
          type: literal
      - [geo:hasGeometry, "https://example.org/recurso/location/plaza-aparcamiento/$(entityid)~iri"]
  # Punto WKT de cada plaza
  parking-spot-location:
    sources:
      - parkingspot-source
    s: https://example.org/recurso/location/plaza-aparcamiento/$(entityid)
    po:
      - [a, geo:Geometry]
      - p: geo:asWKT
        o:
          value: $(location)
          datatype: geo:wktLiteral
  # 3. Instancias ParkingZone (cada entidad ParkingGroup)
  parking-zone:
    sources:
      - parkinggroup-source
    s: https://example.org/recurso/zona-aparcamiento/$(entityid)
    po:
      - [a, edintapar:ParkingZone]
      - [dct:identifier, $(entityid)]
      - [rdfs:label, $(description)]
      - [rdfs:label, $(name)]
      - [geo:hasGeometry, "https://example.org/recurso/location/zona-aparcamiento/$(entityid)~iri"]

  # Poligono WKT de cada zona
  parking-zone-geometry:
    sources:
      - parkinggroup-source
    s: https://example.org/recurso/location/zona-aparcamiento/$(entityid)
    po:
      - [a, geo:Geometry]
      - p: geo:asWKT
        o:
          value: $(polygon)
          datatype: geo:wktLiteral

  # Zona -> plaza: fuente ParkingSpot; no necesita join
  parking-zone-has-spot:
    sources:
      - parkingspot-source
    s: https://example.org/recurso/zona-aparcamiento/$(refparkinggroup)
    po:
      - [edintapar:hasParkingSpot, "https://example.org/recurso/plaza-aparcamiento/$(entityid)~iri"]


  # Aparcamiento -> zona: fuente OffStreetParking normalizado
  offStreet-parking:
    sources:
      - offstreetparking-source
    s: https://example.org/recurso/aparcamiento/$(entityid)
    po:
      # Aparacameinto fuera de la via pública
      - [a, edintapar:OffStreetParking]
      - [dct:identifier, $(entityid)]
      - p: rdfs:label
        o:
          value: "Aparcamiento $(name)"
          type: literal
      - [edintapar:numberOfParkingSpots, $(totalspotnumber) ]
      - [edintapar:hasParkingZone, "https://example.org/recurso/zona-aparcamiento/$(refparkinggroup)~iri"]
      # OffStreetParking -> ParkingSpot
      # Enlace directo adicional: aparcamiento -> plaza.
      - p: edintapar:hasParkingSpot
        o:
          mapping: parking-spot
          condition:
            function: equal
            parameters:
              - [str1, $(refparkinggroup), s]
              - [str2, $(refparkinggroup), o]