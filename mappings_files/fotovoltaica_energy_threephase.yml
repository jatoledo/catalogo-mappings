prefixes:
  sosa: http://www.w3.org/ns/sosa/
  qudt: http://qudt.org/schema/qudt/
  dct: http://purl.org/dc/terms/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  xsd: http://www.w3.org/2001/XMLSchema#
  edintfotov: https://edint.es/def/fotovoltaica#
  unit: http://qudt.org/vocab/unit/

sources:
  threephase-source: ['4_energy_threephaseacmeasurement_normalizado.csv~csv']

mappings:

  # Medidor fotovoltaico
  dispositivo-trifasico:
    sources:
    - threephase-source
    s: https://example.org/recurso/generacion-fotovoltaica/$(entityid)/$(record_id)
    po:
      - [a, edintfotov:PhotovoltaicGeneration]
      - [dct:identifier, "$(entityid)_$(record_id)", xsd:string]
      - [rdfs:label, "Lectura de generación acumulada del día: $(totaldailyenergy) Wh; recibida $(recvtime_iso)", xsd:string]
      - [sosa:observedProperty, edintfotov:generatedElectricity]
      - [sosa:hasResult,"https://example.org/recurso/resultado-generacion/$(entityid)/$(record_id)~iri"]
      - [sosa:madeBySensor,"https://example.org/recurso/medidor/$(refthreephaseacdevice)~iri"]

  resultado_generacion:
    sources:
      - threephase-source
    s: https://example.org/recurso/resultado-generacion/$(entityid)/$(record_id)
    po:
      - [a,qudt:QuantityValue ]
      - [qudt:value, $(totaldailyenergy)]
      - [qudt:hasUnit, unit:W-HR]
      - [rdfs:label, "Energía generada acumulada del día: $(totaldailyenergy) Wh", xsd:string]
  medidor_fotovoltaico:
    sources:
      - threephase-source
    s: https://example.org/recurso/medidor/$(refthreephaseacdevice)
    po:
      - [a, edintfotov:PhotovoltaicMeter]
      - [dct:identifier, "$(refthreephaseacdevice)", xsd:string]
      - [rdfs:label, "Medidor asociado al analizador trifásico $(refthreephaseacdevice)", xsd:string]